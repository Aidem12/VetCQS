spring.application.name=sistema-veterinaria
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/veterinaria}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:veterinaria}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Mexico_City
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:8080}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.bootstrap-admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin-username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin-name=${APP_BOOTSTRAP_ADMIN_NAME:Administrador}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:8080}
