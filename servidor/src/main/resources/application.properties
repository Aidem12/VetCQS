spring.application.name=sistema-veterinaria
server.port=8080

# Valores por omisión para correr fuera de Docker; docker-compose los sobrescribe
spring.datasource.url=jdbc:postgresql://localhost:5432/veterinaria
spring.datasource.username=veterinaria
spring.datasource.password=cambiar_esta_clave

# El esquema lo crea bd/01_modelo_datos.sql; JPA solo verifica que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Mexico_City
