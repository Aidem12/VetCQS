spring.application.name=sistema-veterinaria
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/veterinaria}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:veterinaria}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Mexico_City
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:8080}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.bootstrap-admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin-username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin-name=${APP_BOOTSTRAP_ADMIN_NAME:Administrador}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:8080}

# Migraciones versionadas (Flyway). Las bases existentes se toman como versión 1 (bd/01-03)
# y solo se aplican los cambios aditivos V2 en adelante; nunca se borran datos.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
# Zona horaria de referencia del negocio
app.zona-horaria=America/Mexico_City
# Errores sin detalles internos
server.error.include-stacktrace=never
# Los mensajes de negocio salen por ApiExceptionHandler; los errores no previstos no exponen detalles internos.
server.error.include-message=never
# Datos comerciales del ticket (configurables por variable de entorno)
app.negocio.nombre=${NEGOCIO_NOMBRE:Clínica Veterinaria}
app.negocio.direccion=${NEGOCIO_DIRECCION:}
app.negocio.telefono=${NEGOCIO_TELEFONO:}
app.negocio.rfc=${NEGOCIO_RFC:}
app.negocio.leyenda=${NEGOCIO_LEYENDA:Gracias por su preferencia}
# Adjuntos clínicos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Sesión: expira tras inactividad (configurable). Una sesión activa por usuario.
server.servlet.session.timeout=${SESSION_TIMEOUT:60m}
app.facturacion.proveedor=${FACTURACION_PROVEEDOR:demostracion}
